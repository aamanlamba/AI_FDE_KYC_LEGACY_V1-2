[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Default select (E, F) catches real bugs (unused imports/names, undefined names,
# etc.). E401/E701/E702/E703 are deliberately ignored repo-wide: this codebase's
# established style (set at the P0 baseline, continued through every subsequent
# stage) uses compact single-line statements and combined imports extensively --
# reformatting ~250 existing call sites to satisfy a linter's style opinion would be
# exactly the kind of "rewrite for aesthetic reasons" P10 explicitly says not to do.
# Real findings (unused imports/variables, etc.) are fixed, not suppressed -- see
# docs/architecture/adr/ for the record of this decision.
ignore = ["E401", "E701", "E702", "E703"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py insert the repo root onto sys.path before importing from src/eval --
# an intentional, necessary pattern for a script run directly (not as an installed
# package), which unavoidably places some imports after a statement.
"scripts/*.py" = ["E402"]
